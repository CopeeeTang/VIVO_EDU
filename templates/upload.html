<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../static/globals.css" />
    <link rel="stylesheet" href="../static/css/upload.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        /* 将主要内容区域居中 */
        .div {
            display: flex;
            flex-direction: column; /* 保持子元素垂直排列 */
            align-items: center; /* 水平居中子元素 */
            justify-content: center; /* 垂直居中（可选，取决于期望效果） */
            width: 100%; /* 确保容器占满宽度以便居中 */
            position: relative; /* 确保 overlap-group 的绝对定位相对此容器 */
            min-height: 80vh; /* 给容器一些最小高度以进行垂直居中 */
            padding-top: 50px; /* 为返回按钮留出空间 */
            box-sizing: border-box;
        }

        /* 返回按钮保持在左上角 */
        .component0 {
          position: absolute; /* 或 fixed */
          top: 15px;
          left: 15px;
          z-index: 1000;
        }
        .component0 img {
            width: 30px;
            height: 30px;
        }

        /* 调整上传图标在小屏幕上的大小 */
        @media (max-width: 600px) {
            .vector {
                width: 50%; /* 调整宽度 */
                max-width: 150px; /* 设置最大像素宽度 */
                height: auto; /* 保持纵横比 */
                margin-top: 30px; /* 调整上方间距 */
            }
            .overlap-group img.frame {
                width: 80%; /* 调整下方图标大小 */
                max-width: 100px;
                height: auto;
            }
             .overlap-group {
                 bottom: 40px; /* 调整下方图标位置 */
             }
             .button {
                 margin-top: 50px; /* 调整按钮位置 */
             }
        }
    </style>
  </head>
  <body>
    <div class="screen">
      <!-- 返回按钮 -->
      <div class="component0">
        <a href="./home_page">
          <img class="image0" src="../static/icon/返回.svg" alt="返回" />
        </a>
      </div>
      <div class="div">
        <button class="button" id="upload-btn">
          <div class="primary"><div class="title">选择文件</div></div>
        </button>
        <img class="vector" src="../static/icon/Vector.svg" />
        <div class="overlap-group"><img class="frame" src="../static/icon/Frame.svg" /></div>
      </div>
    </div>

    <!-- 自定义名称模态框 -->
    <div class="modal fade" id="customNameModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">命名</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="custom-name-form">
              <div class="mb-3">
                <label for="child-name" class="form-label">儿童姓名</label>
                <input type="text" class="form-control" id="child-name" required>
              </div>
              <div class="mb-3">
                <label for="date" class="form-label">日期</label>
                <input type="date" class="form-control" id="date" required>
              </div>
              <button type="submit" class="btn btn-primary">上传</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- 隐藏的文件输入框 -->
    <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.aac,.aiff,.caf" style="display: none;">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/upload.js"></script>
  </body>
</html>
